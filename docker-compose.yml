volumes:
  acme:

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    command:
      - --log.level=INFO
      - --accesslog=true
      - --global.sendanonymoususage=false
      - --global.checknewversion=false
      - --certificatesResolvers.leresolver.acme.email=${LE_ACCOUNT_EMAIL}
      - --certificatesResolvers.leresolver.acme.storage=/le/acme.json
      - --certificatesResolvers.leresolver.acme.httpChallenge.entryPoint=web
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/config
      - --providers.file.watch=true
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
    restart: "unless-stopped"
    # Read by the file-provider configs in traefik_conf/ as {{ env "SERVER_FQDN" }}.
    environment:
      - SERVER_FQDN=${SERVER_FQDN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - acme:/le
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/traefik_conf:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      oauth2-proxy:
        condition: service_healthy

  whoami:
    image: traefik/whoami:${TRAEFIK_WHOAMI_VERSION}
    restart: "unless-stopped"
    expose:
      - 80
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=PathPrefix(`/whoami`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.tls=true
      - traefik.http.routers.whoami.tls.certresolver=leresolver
      - traefik.http.routers.whoami.tls.domains[0].main=${SERVER_FQDN}
      - traefik.http.routers.whoami.middlewares=oauth2-proxy@docker
      - traefik.http.services.whoami.loadbalancer.server.port=80

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_VERSION}
    command:
      - --client-id=dummy
      - --client-secret=dummy
      - --cookie-secret=cbiGJkwts9Ye6XD2Pbt_L1jLcipIZBDMfMuqxDWRbeQ=
      - --custom-templates-dir=/templates
      - --cookie-secure=true
      - --htpasswd-file=/.htpasswd
      - --http-address=0.0.0.0:4181
      - --provider=google
      - --reverse-proxy=true
      - --set-authorization-header
      - --set-xauthrequest
      - --skip-provider-button=false
      - --upstream=static://202
    restart: "unless-stopped"
    volumes:
      - ./sign_in.html:/templates/sign_in.html
      - ./.htpasswd:/.htpasswd
    expose:
      - 4181
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4181/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.oauth2-proxy.rule=PathPrefix(`/oauth2`)
      - traefik.http.routers.oauth2-proxy.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy.tls=true
      - traefik.http.routers.oauth2-proxy.tls.certresolver=leresolver
      - traefik.http.routers.oauth2-proxy.tls.domains[0].main=${SERVER_FQDN}
      - traefik.http.middlewares.oauth2-proxy.forwardauth.address=http://oauth2-proxy:4181
      - traefik.http.middlewares.oauth2-proxy.forwardauth.authResponseHeaders=X-Forwarded-User
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4181

  ttyd:
      image: tsl0922/ttyd:alpine
      # Traefik reaches ttyd on the compose network; publishing it on the host
      # would skip the oauth2-proxy login.
      expose:
        - 7681
      extra_hosts:
        - "host.docker.internal:host-gateway"
      volumes:
        # Mount your host machine's SSH keys to the user's home directory
        - ~/.ssh:/home/hostuser/.ssh:ro
      entrypoint: ["/bin/sh", "-c"]
      command:
        - |
          apk add --no-cache openssh-client

          TARGET_UID=$$(stat -c "%u" /home/hostuser/.ssh)
          TARGET_GID=$$(stat -c "%g" /home/hostuser/.ssh)

          addgroup -g $$TARGET_GID hostgroup
          adduser -u $$TARGET_UID -G hostgroup -D -h /home/hostuser hostuser

          exec ttyd -u $$TARGET_UID -g $$TARGET_GID --base-path /terminal --writable \
          -t titleFixed="Host Terminal" \
          -t fontSize=16 \
          -t theme='{"background": "#1e1e1e"}' \
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${HOST_USERNAME}@host.docker.internal
      restart: "unless-stopped"
      labels:
        - traefik.enable=true
        - traefik.http.routers.ttyd.rule=PathPrefix(`/terminal`)
        - traefik.http.routers.ttyd.entrypoints=websecure
        - traefik.http.routers.ttyd.tls=true
        - traefik.http.routers.ttyd.tls.certresolver=leresolver
        - traefik.http.routers.ttyd.tls.domains[0].main=${SERVER_FQDN}
        - traefik.http.routers.ttyd.middlewares=oauth2-proxy@docker
        - traefik.http.services.ttyd.loadbalancer.server.port=7681

  # Chromium desktop streamed to the web page at /browser (Selkies). Its Nginx
  # serves everything under SUBFOLDER, so Traefik does not strip the prefix.
  browser:
    image: lscr.io/linuxserver/chromium:${CHROMIUM_VERSION}
    restart: "unless-stopped"
    shm_size: "1gb"
    environment:
      - PUID=${BROWSER_PUID}
      - PGID=${BROWSER_PGID}
      - TZ=Etc/UTC
      - SUBFOLDER=/browser/
      - TITLE=Browser
      # No sudo, terminal or file transfer in the streamed desktop.
      - HARDEN_DESKTOP=true
      - RESTART_APP=true
      - SELKIES_ENABLE_SHARING=false
    volumes:
      - ${BROWSER_DATA_DIR}:/config
    expose:
      - 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.browser.rule=PathPrefix(`/browser`)
      - traefik.http.routers.browser.entrypoints=websecure
      - traefik.http.routers.browser.tls=true
      - traefik.http.routers.browser.tls.certresolver=leresolver
      - traefik.http.routers.browser.tls.domains[0].main=${SERVER_FQDN}
      - traefik.http.routers.browser.middlewares=oauth2-proxy@docker,browser-slash
      # The container only serves /browser/; send /browser there.
      - traefik.http.middlewares.browser-slash.redirectregex.regex=^(https://[^/]+/browser)$$
      - traefik.http.middlewares.browser-slash.redirectregex.replacement=$${1}/
      - traefik.http.services.browser.loadbalancer.server.port=3000

  cloudcli-init:
    image: curlimages/curl:${CURL_VERSION}
    restart: "no"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Keep this host:port in sync with start.sh and traefik-conf.yaml.
      - |
        until curl -sf "http://host.docker.internal:3010/health" >/dev/null; do sleep 1; done
        curl -sf -X POST "http://host.docker.internal:3010/api/auth/register" \
          -H "Content-Type: application/json" \
          -d "{\"username\":\"$$CLOUDCLI_INIT_USERNAME\",\"password\":\"$$CLOUDCLI_INIT_PASSWORD\"}" || true
